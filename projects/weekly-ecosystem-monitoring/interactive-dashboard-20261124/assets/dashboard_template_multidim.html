<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>生态监控 · 多维看板</title>
  <style>
    :root {
      --bg:#f4f0f8; --paper:rgba(255,255,255,.9); --text:#252230; --muted:#817b8d;
      --line:#eee9f3; --purple:#7558d5; --purple2:#a06ee8; --green:#16a36a; --red:#e15361;
      --radius:20px; --shadow:0 16px 42px rgba(57,43,96,.07); font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;
    }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--text); background:
      radial-gradient(circle at 8% 0%,rgba(179,145,244,.24),transparent 34%),
      radial-gradient(circle at 92% 9%,rgba(250,204,219,.24),transparent 26%),
      linear-gradient(180deg,#f8f5fb 0%,#f2eef6 52%,#f8f6fa 100%); min-height:100vh; }
    button,select,input { font:inherit; }
    button { cursor:pointer; }
    .page { width:min(100% - 34px,1480px); margin:0 auto; padding:16px 0 36px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .brand { display:flex; align-items:center; gap:10px; }
    .logo { width:38px; height:38px; border-radius:13px; display:grid; place-items:center; color:#fff;
      background:linear-gradient(145deg,#8769e7,#5e42bd); box-shadow:0 9px 24px rgba(101,72,194,.3); font-weight:900; }
    .brand-title { font-size:12px; font-weight:800; }
    .brand-sub { color:var(--muted); font-size:10px; margin-top:2px; }
    .source-pill { display:flex; gap:8px; align-items:center; border:1px solid #eee9f3; background:rgba(255,255,255,.7);
      border-radius:999px; padding:8px 12px; font-size:11px; color:#57515f; }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 0 4px rgba(22,163,106,.11); }
    .hero { padding:18px 22px 17px; border-radius:24px; border:1px solid rgba(113,87,180,.14); background:rgba(255,255,255,.88);
      box-shadow:var(--shadow); position:relative; overflow:hidden; }
    .hero::before { content:""; position:absolute; width:220px; height:220px; border-radius:50%; right:-70px; top:-110px;
      background:linear-gradient(145deg,rgba(161,118,231,.16),rgba(249,174,209,.18)); }
    .hero-head { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; position:relative; }
    h1 { margin:0; font-size:27px; letter-spacing:-.7px; }
    .hero-copy { margin:6px 0 0; color:#6c6577; font-size:11px; }
    .latest-badge { border-radius:10px; padding:7px 11px; color:#6548ba; background:#f0ebff; font-weight:800; font-size:11px; white-space:nowrap; }
    .time-compare { margin-top:14px; padding:13px; border:1px solid #e7e0f0; border-radius:16px; background:#fbfafd; position:relative; }
    .compare-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .compare-title { font-size:12px; font-weight:900; }
    .compare-help { margin-left:7px; color:var(--muted); font-size:10px; font-weight:400; }
    .mode-tabs { display:flex; gap:4px; padding:3px; border-radius:11px; background:#f0ecf7; flex-wrap:wrap; }
    .mode-tabs button { border:0; border-radius:8px; background:transparent; color:var(--muted); padding:7px 10px; font-size:10px; font-weight:900; }
    .mode-tabs button.active { background:#fff; color:#6045b7; box-shadow:0 3px 12px rgba(66,49,118,.1); }
    .mode-tabs button:disabled { opacity:.4; cursor:not-allowed; }
    .compare-fields { display:grid; grid-template-columns:repeat(2,minmax(150px,1fr)); gap:9px; margin-top:10px; max-width:620px; }
    .anchor-mode-banner { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; padding:11px 13px; border-radius:14px; background:#f1ecff; border:1px solid #ddd1fb; }
    .anchor-mode-banner strong { display:block; font-size:12px; }
    .anchor-mode-banner span { color:var(--muted); font-size:10px; }
    .controls { margin-top:12px; display:grid; grid-template-columns:repeat(4,minmax(120px,1fr)); gap:9px; position:relative; }
    .control { background:#fbfafd; border:1px solid #ece7f2; border-radius:13px; padding:9px 11px; min-height:56px; }
    .control label { display:block; color:var(--muted); font-size:10px; margin-bottom:4px; }
    .control select,.control input { width:100%; border:0; outline:0; background:transparent; color:var(--text); font-weight:800; font-size:12px; }
    .control input::placeholder { color:#a49dad; font-weight:600; }
    .dimension-builder { margin-top:13px; padding:13px 14px; border:1px solid #e7e0f0; border-radius:16px; background:rgba(251,250,253,.92); }
    .dimension-builder-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:9px; }
    .dimension-builder-title { font-size:12px; font-weight:900; }
    .dimension-builder-help { color:var(--muted); font-size:10px; }
    .dimension-stack { display:flex; align-items:center; flex-wrap:wrap; gap:7px; min-height:42px; padding:3px; border-radius:13px; outline:1px dashed transparent; }
    .dimension-stack.drag-over { outline-color:#b7a5e6; background:#f5f1ff; }
    .dimension-chip { display:flex; align-items:center; gap:5px; border:1px solid #e4dcf0; border-radius:12px; padding:7px 8px; background:#fff; box-shadow:0 4px 12px rgba(76,55,127,.05); }
    .dimension-chip.selected { border-color:#ccbdec; background:#f7f3ff; }
    .dimension-chip.next { border-color:#8f75dd; background:#eee8ff; box-shadow:0 5px 16px rgba(102,73,187,.13); }
    .dimension-chip.dragging { opacity:.45; }
    .dimension-chip.drag-over { border-color:#8466db; }
    .drag-handle { color:#a096ad; font-weight:900; letter-spacing:-2px; padding:0 2px; cursor:grab; }
    .chip-order { display:grid; place-items:center; width:18px; height:18px; border-radius:6px; background:#f0ebf8; color:#655975; font-size:9px; font-weight:900; }
    .dimension-chip.next .chip-order { background:#7658d3; color:#fff; }
    .chip-text { font-size:11px; font-weight:900; white-space:nowrap; }
    .dim-chip-btn { width:22px; height:22px; border:0; border-radius:7px; background:#f4f1f8; color:#756b80; font-size:12px; line-height:1; padding:0; }
    .dim-chip-btn:hover { background:#eae3f5; }
    .dim-chip-btn:disabled { opacity:.3; cursor:not-allowed; }
    .dim-chip-btn.remove { color:#a45e68; }
    .dimension-add { display:flex; align-items:center; gap:7px; margin-left:auto; }
    .dimension-add select { min-width:125px; border:1px solid #e2dbed; border-radius:9px; background:#fff; padding:7px 8px; font-size:11px; }
    .custom-panel { margin-top:10px; padding:11px; border-radius:13px; border:1px solid #e8e1f1; background:#fff; }
    .custom-title { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:9px; }
    .custom-title strong { font-size:12px; }
    .custom-range-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .custom-range { padding:10px; border-radius:11px; background:#fff; border:1px solid #eee8f4; }
    .custom-range label { display:block; color:var(--muted); font-size:10px; margin-bottom:6px; font-weight:800; }
    .date-row { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:5px; }
    .date-row input { min-width:0; width:100%; border:1px solid #e6e0ed; border-radius:8px; padding:7px 8px; background:#fff; color:var(--text); font-size:11px; }
    .custom-actions { margin-top:9px; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
    .preset { border:1px solid #e4ddf0; border-radius:9px; background:#fff; color:#655875; padding:7px 9px; font-size:10px; font-weight:800; }
    .preset.active,.primary { border-color:#7558d5; background:#7558d5; color:#fff; }
    .custom-message { margin-top:8px; color:var(--muted); font-size:10px; }
    .custom-message.error { color:var(--red); }
    .scope-strip { display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin-top:13px; color:var(--muted); font-size:11px; }
    .chip { border:1px solid #e8e2f0; background:#fff; border-radius:999px; padding:5px 9px; }
    .chip strong { color:#514960; }
    .section { margin-top:18px; }
    .section-head { display:flex; justify-content:space-between; align-items:end; gap:16px; margin:0 3px 10px; }
    .section-title { font-size:18px; font-weight:900; letter-spacing:-.25px; }
    .section-sub { margin-top:3px; color:var(--muted); font-size:11px; }
    .kpis { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
    .kpi { background:var(--paper); border:1px solid rgba(112,88,185,.11); border-radius:var(--radius); padding:15px 16px; min-height:128px; box-shadow:var(--shadow); }
    .kpi-label { color:var(--muted); font-size:11px; }
    .kpi-main { margin-top:6px; font-size:27px; line-height:1.15; font-weight:900; letter-spacing:-.7px; }
    .kpi-main small { font-size:11px; color:var(--muted); font-weight:600; margin-left:3px; letter-spacing:0; }
    .kpi-foot { margin-top:9px; font-size:11px; color:var(--muted); }
    .up { color:var(--green); } .down { color:var(--red); } .neutral { color:var(--muted); }
    .card { background:var(--paper); border:1px solid rgba(112,88,185,.11); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
    .trend-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .chart-card { padding:15px; }
    .chart-title { font-weight:900; }
    .chart-note { color:var(--muted); font-size:10px; margin-top:2px; }
    .chart { height:245px; margin-top:5px; }
    .chart svg { width:100%; height:100%; overflow:visible; }
    .chart text { fill:#8d8796; font-size:10px; font-family:inherit; }
    .chart .grid { stroke:#eeeaf4; }
    .chart .line { fill:none; stroke:var(--purple); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    .chart .dot { fill:#fff; stroke:var(--purple); stroke-width:2; }
    .chart .value { fill:#5a5364; font-weight:800; }
    .focus-card { padding:17px; display:grid; grid-template-columns:1.3fr .7fr; gap:14px; }
    .focus-title { font-size:20px; font-weight:900; }
    .focus-meta { margin-top:5px; color:var(--muted); font-size:11px; }
    .focus-metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-top:14px; }
    .focus-metric { background:#faf9fc; border:1px solid #eeeaf4; border-radius:13px; padding:10px; }
    .focus-metric label { display:block; color:var(--muted); font-size:9px; }
    .focus-metric strong { display:block; margin-top:4px; font-size:16px; }
    .focus-metric span { display:block; margin-top:3px; font-size:10px; }
    .search-results { display:flex; flex-wrap:wrap; gap:6px; }
    .search-results-head { display:flex; justify-content:space-between; gap:8px; margin-bottom:8px; color:var(--muted); font-size:10px; }
    .search-result { border:1px solid #e6def3; background:#fff; border-radius:10px; padding:7px 9px; font-size:11px; text-align:left; }
    .search-result strong { display:block; color:var(--ink); font-size:11px; font-weight:600; }
    .search-result span { display:block; margin-top:2px; color:var(--muted); font-size:9px; }
    .search-empty { color:var(--muted); font-size:11px; padding:10px 0; }
    .toolbar { padding:13px 15px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
    .breadcrumb { display:flex; gap:7px; align-items:center; color:var(--muted); font-size:11px; flex-wrap:wrap; }
    .crumb { border:0; background:none; padding:0; color:#6d52c4; font-weight:800; }
    .toolbar-right { display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
    .segmented { display:flex; gap:3px; padding:3px; background:#f3eff8; border-radius:11px; }
    .segmented button { border:0; background:none; color:var(--muted); border-radius:8px; padding:7px 9px; font-size:11px; font-weight:800; }
    .segmented button.active { background:#fff; color:#5d45b4; box-shadow:0 3px 12px rgba(66,49,118,.1); }
    .search { border:1px solid #e5dfed; background:#fff; border-radius:10px; padding:8px 10px; min-width:210px; }
    .search input { width:100%; border:0; outline:0; background:none; font-size:11px; }
    .ghost { border:1px solid #e4deed; background:#fff; border-radius:10px; padding:8px 10px; color:#5d5669; font-weight:800; font-size:11px; }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
    th { padding:11px 12px; text-align:right; color:var(--muted); font-size:10px; border-bottom:1px solid var(--line); background:#faf9fc; white-space:nowrap; }
    td { padding:12px; border-bottom:1px solid #f1edf5; text-align:right; white-space:nowrap; font-size:11px; }
    th:first-child,td:first-child { text-align:left; }
    tbody tr:last-child td { border-bottom:0; }
    tbody tr.clickable { cursor:pointer; }
    tbody tr.clickable:hover { background:#fbfafe; }
    .rank { display:inline-grid; place-items:center; width:23px; height:23px; border-radius:8px; background:#f0ecf7; color:#756987; font-size:10px; font-weight:900; margin-right:8px; }
    .rank.top { background:#ebe4ff; color:#654ac3; }
    .node-name { font-weight:900; }
    .node-sub { margin-top:2px; color:var(--muted); font-size:9px; }
    .value { font-weight:800; }
    .table-summary { padding:9px 14px; border-bottom:1px solid var(--line); color:var(--muted); font-size:10px; line-height:1.6; }
    .tree-cell { display:flex; align-items:flex-start; gap:7px; }
    .tree-toggle { flex:0 0 22px; width:22px; height:22px; padding:0; border:1px solid #e2dbed; border-radius:7px; background:#faf8fd; color:#6d55b8; font-weight:900; line-height:1; }
    .tree-toggle-spacer { flex:0 0 22px; width:22px; height:22px; }
    .tree-copy { min-width:0; }
    .tree-name-button { display:block; border:0; padding:0; background:none; text-align:left; color:var(--text); }
    .tree-name-button.selected .node-name { color:#6d4fc9; }
    .tree-level-tag { display:inline-block; margin-right:5px; padding:2px 5px; border-radius:5px; background:#f0ebf9; color:#75618f; font-size:9px; font-weight:800; }
    .tree-expand-label { margin-left:5px; color:#8b78ad; font-size:9px; }
    .tree-row.expanded > td { background:#fcfbff; }
    .notice { margin-top:10px; padding:11px 13px; border-radius:13px; background:#fff7e8; border:1px solid #f4dfb8; color:#815c22; font-size:11px; }
    .coverage-notice { display:flex; flex-wrap:wrap; gap:5px 10px; align-items:baseline; background:#f4f1fb; border-color:#ded5f1; color:#695c81; }
    .coverage-notice strong { color:#513b87; }
    .kpi-main .unavailable { font-size:18px; color:#7d7089; }
    .notes { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .note { padding:15px; }
    .note h3 { margin:0 0 7px; font-size:13px; }
    .note p,.note li { color:#6c6574; font-size:11px; line-height:1.7; }
    .note ul { margin:0; padding-left:17px; }
    .footer { display:flex; justify-content:space-between; gap:20px; margin-top:16px; color:#9b95a3; font-size:10px; }
    .empty { padding:38px; text-align:center; color:var(--muted); }
    .loading { min-height:70vh; display:grid; place-items:center; color:var(--muted); }
    @media(max-width:1100px) { .controls,.compare-fields{grid-template-columns:repeat(2,1fr)} .kpis,.focus-metrics{grid-template-columns:repeat(2,1fr)} .trend-grid,.focus-card,.notes,.custom-range-grid{grid-template-columns:1fr} }
    @media(max-width:680px) { .page{width:calc(100% - 20px)} .controls,.kpis,.compare-fields{grid-template-columns:1fr} h1{font-size:23px} .hero-head,.topbar,.dimension-builder-head,.compare-head,.anchor-mode-banner{flex-direction:column;align-items:flex-start} .dimension-add{margin-left:0;flex-wrap:wrap} }
  </style>
</head>

    function buildTreeRows(){
      ensureTreePathExpanded();
      const out=[];
      const walk=(path,depth)=>{
        const rows=rankingAtPath(path);
        for(const row of rows){
          const rowPath=[...path,{dim:row.kind,value:row.id}],key=pathKey(rowPath);
          const canExpand=rowPath.length<state.dimStack.length,expanded=state.treeExpanded.has(key);
          out.push({...row,rowPath,depth,key,canExpand,expanded,selected:key===pathKey(state.path)});
          if(canExpand&&expanded)walk(rowPath,depth+1);
        }
      };
      walk([],0);
      return out;
    }
    function treeTableHtml(rows){
      const m=state.eventUser?metricMap.rev:metricMap[state.metricId];
      if(!rows.length)return `<div class="empty">当前维度栈下无复层数据</div>`;
      return rows.map(r=>`<tr class="tree-row ${r.expanded?"expanded":""}"><td><div class="tree-cell" style="padding-left:${r.depth*18}px">${r.canExpand?`<button type="button" class="tree-toggle" data-tree-toggle="${esc(r.key)}" aria-expanded="${r.expanded}">${r.expanded?"▾":"›"}</button>`:`<span class="tree-toggle-spacer"></span>`}<div class="tree-copy"><button type="button" class="tree-name-button ${r.selected?"selected":""}" data-tree-select="true" data-tree-path="${esc(JSON.stringify(r.rowPath))}"><span class="tree-level-tag">${esc(DIMENSIONS[r.kind].label)}</span><span class="node-name">${esc(r.name)}</span>${r.canExpand?`<span class="tree-expand-label">${r.expanded?"收起":"展开"}</span>`:""}</button><div class="node-sub">${esc(r.sub)}</div></div></div></td><td>${val(r.previous,m)}</td><td class="value">${val(r.current,m)}</td><td class="${cls(r.delta)}">${prettyDelta(r.delta,m)}</td><td class="${cls(r.change)}">${changeText(r.change)}</td><td class="${cls(r.delta)}">${contributionText(r.parentContribution)}</td><td class="${cls(r.delta)}">${contributionText(r.totalContribution)}</td><td>${r.interactionAgg?.interactionRate!==undefined?`${(r.interactionAgg.interactionRate*100).toFixed(2)}%`:"-"}</td><td>${r.interactionAgg?.intUser?fmtNum(r.interactionAgg.intUser):"-"}</td></tr>`).join("");
    }

    function render(){
      const p=activePeriod(),focus=focusAnchorInfo(),metric=state.eventUser?metricMap.rev:metricMap[state.metricId],rankInfo=buildRanking(),rows=rankInfo.rows,treeRows=state.multiOpen&&!focus?buildTreeRows():[],secondary=["attr","rev","pay","arppu","view","dau","liveAnchors","interactionUsers","interactionRate"].find(x=>x!==state.metricId)||"rev";
      const m=metric;
      const metricOptions=metrics.map(o=>`<option value="${o.id}" ${o.id===state.metricId?"selected":""}>${esc(o.label)}</option>`).join("");
      const granOptions=granList.map(g=>`<option value="${g.id}" ${g.id===state.granularity?"selected":""}>${esc(g.label)}</option>`).join("");
      const eventDisabled=M.eventStatus!=="ready";
      const matches=anchorMatches(),anchorQueryActive=state.anchorQuery.trim().length>0,scopeText=pathSummary();
      const coverage=rankInfo.coverage,directFocusMode=Boolean(focus)&&directAnchorScope(),showCoverageNotice=!directFocusMode&&(state.compareMode!=="week"||rankInfo.usesWeekly);
      const coverageNotice=showCoverageNotice?`<div class="notice coverage-notice"><strong>${rankInfo.usesWeekly&&!rankInfo.comparisonAvailable?"周粒度源数据未同时覆盖两个对比期":"主播、公会和主播层级按覆盖周计算"}</strong><span>本期 ${esc(p.currentLabel||periodLabel(p))}：${esc(coverage.currentText)}；对比期 ${esc(p.previousLabel||comparisonPeriodLabel(p))}：${esc(coverage.previousText)}。${rankInfo.usesWeekly&&!rankInfo.comparisonAvailable?"未覆盖的一侧以“数据不足”显示，不按 0 计算环比和贡献。":"非周对比使用覆盖周近似。"}</span></div>`:"";
      const next=nextDimension(),tableDimension=next?DIMENSIONS[next].label:"当前节点",contributionSuffix=m.kind==="people"?"*":"";
      app.innerHTML=`
        <div class="topbar"><div class="brand"><div class="logo">E</div><div><div class="brand-title">生态监控 · 全品类分析</div><div class="brand-sub">Category Ecology Health</div></div></div><div class="source-pill"><span class="dot"></span>BigData 已更新 · 趋势 ${M.aggregateStartDate} 至 ${M.aggregateEndDate} · 主播 ${M.anchorStartDate} 至 ${M.anchorEndDate}</div></div>
        <section class="hero"><div class="hero-head"><div><h1>全品类生态监控看板</h1><p class="hero-copy">维度可增删、可拖动排序；时间、对比期、趋势粒度和主播追踪统一联动。</p></div><div class="latest-badge">数据截至 ${M.sourceLatestPartition}</div></div>
          ${timeComparisonHtml()}
          <div class="controls">
            <div class="control"><label>分析指标</label><select id="metric">${metricOptions}</select></div>
            <div class="control"><label>赛事用户（支付口径）</label><select id="eventFilter" ${eventDisabled?"disabled":""}><option value="">全部支付用户</option><option value="1" ${state.eventUser==="1"?"selected":""}>赛事用户</option><option value="0" ${state.eventUser==="0"?"selected":""}>非赛事用户</option></select></div>
            <div class="control"><label>趋势粒度</label><select id="granularity">${granOptions}</select></div>
            <div class="control" style="grid-column:span 2"><label>主播专项追踪：ID / 昵称 / RoomID</label><input id="anchorSearch" value="${esc(state.anchorQuery)}" placeholder="支持模糊搜索，例如 dankng、UID 或 RoomID" autocomplete="off"></div>
          </div>
          ${focus?`<div class="anchor-mode-banner"><div><strong>主播模式 · ${esc(focus.name)}</strong><span>已隐藏维度搭建和多层表，只展示该主播的变化趋势。</span></div><button type="button" class="ghost" data-clear-anchor>返回全品类分析</button></div>`:dimensionBuilderHtml()}
          <div class="scope-strip"><span class="chip">当前 <strong>${esc(periodLabel(p))}</strong></span><span class="chip">对比 <strong>${esc(comparisonPeriodLabel(p))}</strong></span><span class="chip">${esc(scopeText)}</span><span>${esc(m.help)}</span></div>
          ${coverageNotice}
          ${eventDisabled?`<div class="notice">赛事用户支付数据仍在计算，当前选项暂不可用。其余品类、公会、主播层级和主播追踪已可使用。</div>`:state.eventUser!==""?`<div class="notice">已切换赛事用户支付口径：DAU、归属用户和互动指标不做拆分；赛事用户按支付用户前90天赛事主播观时占比≥70%判定。</div>`:""}
          ${anchorQueryActive?`<div class="section"><div class="search-results-head"><span>主播候选列表</span><span>${matches.length} 个可选项 · 优先展示精确、前缀和模糊匹配</span></div>${matches.length?`<div class="search-results">${matches.map(a=>`<button class="search-result" data-pick-anchor="${a.idx}"><strong>${esc(a.name)}</strong><span>UID ${esc(a.id)} · Room ${esc(a.roomid||"-")}</span></button>`).join("")}</div>`:`<div class="search-empty">未找到主播，请检查 UID/RoomID，或减少昵称关键词。</div>`}</div>`:""}
        </section>
        ${focus?`<section class="section anchor-mode"><article class="card focus-card"><div><div class="focus-title">${esc(focus.name)}</div><div class="focus-meta">UID ${esc(focus.id)} · RoomID ${esc(focus.roomid||"-")} · ${esc(p.short)}</div><div class="focus-meta">当前为单主播视图；搜索框可随时切换主播。</div><div class="focus-metrics">${["dau","attr","rev","interactionUsers","interactionRate","liveAnchors"].map(id=>{const mm=metricMap[id],s=trendSeries(id),a=s.at(-1)?.value||0,b=s.at(-2)?.value||0;return `<div class="focus-metric"><label>${mm.label}</label><strong>${val(a,mm)}</strong><span class="${cls(a-b)}">${prettyDelta(a-b,mm)}</span></div>`;}).join("")}</div></div><div><div class="focus-meta">主播 DAU、流水和互动按日精确追踪；联盟/公会等组合口径按覆盖周近似。</div></div></article></section>`:`<section class="section"><div class="section-head"><div><div class="section-title">两期核心指标</div><div class="section-sub">${esc(scopeText)} · ${esc(p.short)}</div></div></div><div class="kpis">${renderKpis()}</div></section>`}
        <section class="section"><div class="section-head"><div><div class="section-title">时间趋势 · ${granMap[state.granularity].label}</div><div class="section-sub">${state.eventUser!==""?"赛事支付口径覆盖 W42–W47":state.compareMode!=="week"?`趋势限定在 ${periodLabel(p)} 与 ${comparisonPeriodLabel(p)}；主播、公会按覆盖周近似`:(state.guildId!==""||state.tier!==""||focus)?"公会、层级、主播与互动率按周口径展示":`覆盖 ${M.aggregateStartDate} 至 ${M.aggregateEndDate}；按桶内实际天数计算日均`}；星号表示未完整时间桶。</div></div></div><div class="trend-grid"><article class="card chart-card"><div class="chart-title">${m.label} · ${granMap[state.granularity].label}</div><div class="chart-note">${esc(scopeText)}</div><div class="chart">${svg(trendSeries(state.metricId),m)}</div></article><article class="card chart-card"><div class="chart-title">${metricMap[secondary].label} · ${granMap[state.granularity].label}</div><div class="chart-note">辅助观察指标</div><div class="chart">${svg(trendSeries(secondary),metricMap[secondary])}</div></article></div></section>
        <section class="section"><div class="section-head"><div><div class="section-title">${focus?"主播明细":(rankInfo.usesWeekly&&!rankInfo.comparisonAvailable?"单层覆盖表 · ":"单层贡献表 · ")+tableDimension+" Top20"}</div><div class="section-sub">${focus?"当前主播的指标明细。":rankInfo.usesWeekly&&!rankInfo.comparisonAvailable?"周粒度源数据只覆盖一侧，按覆盖期规模排序；点击节点仍可继续下钻。":"展示当前路径下的下一层节点；点击节点继续下钻，或点击面包屑回退。"}</div></div>${focus?"":`<button type="button" class="ghost" data-toggle-multi>${state.multiOpen?"收起多层结构":"查看多层结构"}</button>`}</div><article class="card"><div class="toolbar"><div class="breadcrumb">${breadcrumb()}<span>·</span><span>${rows.length} 个节点</span></div><div class="toolbar-right"><div class="segmented"><button data-sort="drag" class="${state.sortMode==="drag"?"active":""}" ${rankInfo.usesWeekly&&!rankInfo.comparisonAvailable?"disabled":""}>负向拖累</button><button data-sort="lift" class="${state.sortMode==="lift"?"active":""}" ${rankInfo.usesWeekly&&!rankInfo.comparisonAvailable?"disabled":""}>正向拉动</button><button data-sort="absolute" class="${state.sortMode==="absolute"?"active":""}" ${rankInfo.usesWeekly&&!rankInfo.comparisonAvailable?"disabled":""}>变化贡献</button></div><div class="search"><input id="tableSearch" value="${esc(state.tableSearch)}" placeholder="搜索当前层级节点"></div><button class="ghost" id="export">导出单层 CSV</button></div></div><div class="table-summary">${rankInfo.usesWeekly&&!rankInfo.comparisonAvailable?"当前表依赖主播周汇总，两个对比期未被同时覆盖，因此按覆盖期规模排序；环比、父层贡献和总盘贡献标记为“数据不足”，不以 0 替代。":`父层日均变化 <strong>${prettyDelta(rankInfo.parentDelta,m)}</strong>；全平台日均变化 <strong>${prettyDelta(rankInfo.totalDelta,m)}</strong>。父层贡献率 = 节点日均变化 ÷ 当前范围日均变化；总盘贡献率 = 节点日均变化 ÷ 全平台日均变化。Top20 非全量，贡献率合计不一定为 100%。`}${contributionSuffix?" * 人数类指标跨品类或主播可能重复，贡献率只用于相对判断。":""}</div><div class="table-wrap"><table><thead><tr><th>层级 / 节点</th><th>对比期日均</th><th>当前期日均</th><th>日均变化</th><th>环比</th><th>父层贡献${contributionSuffix}</th><th>总盘贡献${contributionSuffix}</th><th>互动率</th><th>互动人数</th></tr></thead><tbody id="singleTableBody">${tableHtml(rows)}</tbody></table></div></article></section>
        ${!focus&&state.multiOpen?`<section class="section"><div class="section-head"><div><div class="section-title">多层结构表</div><div class="section-sub">按当前维度栈递归展开；父层贡献以直接父节点为分母，总盘贡献以全平台为分母。</div></div></div><article class="card"><div class="toolbar"><div class="breadcrumb"><span>当前路径</span><span>/</span><strong>${esc(pathSummary())}</strong><span>·</span><span>${treeRows.length} 行</span></div><div class="toolbar-right"><button class="ghost" id="exportTree">导出复层 CSV</button></div></div><div class="table-summary">同一主播或同一用户可能出现在多个品类、公会路径下；复层表用于观察结构贡献，不应把各行人数直接相加。${contributionSuffix?" *":""}</div><div class="table-wrap"><table><thead><tr><th>层级 / 节点</th><th>对比期日均</th><th>当前期日均</th><th>日均变化</th><th>环比</th><th>父层贡献${contributionSuffix}</th><th>总盘贡献${contributionSuffix}</th><th>互动率</th><th>互动人数</th></tr></thead><tbody id="treeTableBody">${treeTableHtml(treeRows)}</tbody></table></div></article></section>`:""}
        <section class="section notes"><article class="card note"><h3>口径与覆盖</h3><ul><li>平台、内容大类和品类使用健康日表“品类整体”口径，按日期精确计算日均；平台 DAU 不再汇总主播明细。</li><li>开播主播数按当天有开播的 luid 去重后计算日均；品类、内容大类和平台使用日级精确去重，公会、层级和主播使用主播周明细的 live_days。</li><li>主播、公会和主播层级来自主播周汇总；主播明细 DAU 跨品类、跨主播可能重叠，应理解为“主播口径覆盖 DAU”。</li><li>互动率=互动人数/观看 DAU；跨品类、跨主播汇总时人数未去重，极端行可能超过100%，仅用于相对趋势监控。</li></ul></article><article class="card note"><h3>层级与赛事</h3><ul><li>主播层级按主播整体平均 ACU 统一判定：头部 ACU≥2000，腰部 100–1999，尾部<100。</li><li>${esc(M.eventMethod)}。</li><li>${M.eventStatus==="ready"?"赛事支付数据已更新。":"赛事支付用户数据仍待回刷，当前暂不可用。"}</li></ul></article></section>
        <div class="footer"><span>来源：${esc(M.source)} · 公会：${esc(M.guildSource)}</span><span>多维度 MVP · ${M.sourceLatestPartition}</span></div>`;
      window.__dashDebug={state,currentNodes,aggregateLevel,ranking,buildRanking,rankingAtPath,buildTreeRows,weeks,weekIndex,activePeriod,trendSeries,reorderDimension,addDimension,removeDimension};
      bind();
    }

    function bind(){
      const set=(id,key,fn)=>document.getElementById(id)?.addEventListener("change",e=>{state[key]=e.target.value;fn?.(e.target.value);render();});
      document.querySelectorAll("[data-compare-mode]").forEach(button=>button.addEventListener("click",()=>{state.compareMode=button.dataset.compareMode;state.customError="";render();}));
      set("period","periodId");set("monthCurrent","monthCurrent");set("monthPrevious","monthPrevious");set("quarterCurrent","quarterCurrent");set("quarterPrevious","quarterPrevious");set("yearCurrent","yearCurrent");set("yearPrevious","yearPrevious");set("granularity","granularity");
      set("metric","metricId",v=>{if(state.eventUser!==""&&!["rev","pay","arppu"].includes(v))state.metricId="rev";});
      set("eventFilter","eventUser",v=>{if(v&&!["rev","pay","arppu"].includes(state.metricId))state.metricId="rev";});
      document.getElementById("anchorSearch")?.addEventListener("input",e=>{state.anchorQuery=e.target.value;render();setTimeout(()=>{const el=document.getElementById("anchorSearch");if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},0);});
      document.querySelectorAll("[data-pick-anchor]").forEach(b=>b.addEventListener("click",()=>{state.path=[];state.treeExpanded.clear();state.multiOpen=false;state.groupId="";state.categoryId="";state.guildId="";state.tier="";state.focusUid=b.dataset.pickAnchor;state.anchorQuery="";render();}));
      document.querySelector("[data-clear-anchor]")?.addEventListener("click",()=>{state.path=state.path.filter(item=>item.dim!=="anchor");state.treeExpanded.clear();state.multiOpen=false;state.focusUid="";state.anchorQuery="";syncPathFilters();render();});
      let dragging=null;
      const stack=document.getElementById("dimensionStack");
      document.querySelectorAll("[data-dimension-chip]").forEach(chip=>{
        chip.addEventListener("dragstart",event=>{dragging=chip.dataset.dimensionChip;chip.classList.add("dragging");if(event.dataTransfer){event.dataTransfer.effectAllowed="move";event.dataTransfer.setData("text/plain",dragging);}});
        chip.addEventListener("dragend",()=>{dragging=null;chip.classList.remove("dragging");stack?.classList.remove("drag-over");document.querySelectorAll(".dimension-chip.drag-over").forEach(el=>el.classList.remove("drag-over"));});
        chip.addEventListener("dragover",event=>{event.preventDefault();if(dragging&&dragging!==chip.dataset.dimensionChip){chip.classList.add("drag-over");if(event.dataTransfer)event.dataTransfer.dropEffect="move";}});
        chip.addEventListener("dragleave",()=>chip.classList.remove("drag-over"));
        chip.addEventListener("drop",event=>{event.preventDefault();const target=chip.dataset.dimensionChip;chip.classList.remove("drag-over");if(dragging&&dragging!==target){reorderDimension(dragging,target);render();}});
      });
      document.querySelectorAll("[data-dim-shift]").forEach(button=>button.addEventListener("click",()=>{const dim=button.dataset.dim,index=state.dimStack.indexOf(dim),target=state.dimStack[index+Number(button.dataset.dimShift)];if(target){reorderDimension(dim,target);render();}}));
      document.querySelectorAll("[data-dim-remove]").forEach(button=>button.addEventListener("click",()=>{removeDimension(button.dataset.dimRemove);render();}));
      document.getElementById("addDimensionButton")?.addEventListener("click",()=>{const dim=document.getElementById("dimensionAddSelect")?.value;if(dim){addDimension(dim);render();}});
      const draftMap={customPreviousStart:"previousStart",customPreviousEnd:"previousEnd",customCurrentStart:"currentStart",customCurrentEnd:"currentEnd"};
      Object.entries(draftMap).forEach(([id,key])=>document.getElementById(id)?.addEventListener("input",event=>{state.customDraft[key]=event.target.value;state.customError="";}));
      document.getElementById("applyCustomPeriod")?.addEventListener("click",()=>applyCustomValues({...state.customDraft}));
      document.querySelectorAll("[data-custom-preset]").forEach(button=>button.addEventListener("click",()=>applyCustomValues(presetCustom(button.dataset.customPreset))));
      document.querySelectorAll("[data-node-kind]").forEach(row=>row.addEventListener("click",()=>{const dim=nextDimension();if(!dim||dim!==row.dataset.nodeKind)return;const raw=row.dataset.nodeId,value=dim==="tier"?raw:Number(raw);state.path.push({dim,value});syncPathFilters();if(dim==="anchor"){state.anchorQuery="";state.multiOpen=false;}render();}));
      document.querySelectorAll("[data-crumb-index]").forEach(button=>button.addEventListener("click",()=>{const index=Number(button.dataset.crumbIndex);state.path=index<0?[]:state.path.slice(0,index+1);syncPathFilters();if(state.focusUid==="")state.anchorQuery="";render();}));
      document.querySelectorAll("[data-tree-toggle]").forEach(button=>button.addEventListener("click",()=>{const key=button.dataset.treeToggle;if(state.treeExpanded.has(key))state.treeExpanded.delete(key);else state.treeExpanded.add(key);render();}));
      document.querySelector("[data-toggle-multi]")?.addEventListener("click",()=>{state.multiOpen=!state.multiOpen;if(!state.multiOpen)state.treeExpanded.clear();render();});
      document.querySelectorAll("[data-tree-select]").forEach(button=>button.addEventListener("click",()=>{try{state.path=JSON.parse(button.dataset.treePath);syncPathFilters();if(state.focusUid==="")state.anchorQuery="";render();}catch{}}));
      document.querySelectorAll("[data-sort]").forEach(b=>b.addEventListener("click",()=>{state.sortMode=b.dataset.sort;render();}));
      document.getElementById("tableSearch")?.addEventListener("input",e=>{state.tableSearch=e.target.value;render();setTimeout(()=>{const el=document.getElementById("tableSearch");if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},0);});
      document.getElementById("export")?.addEventListener("click",()=>exportCsv());
      document.getElementById("exportTree")?.addEventListener("click",()=>exportTreeCsv());
    }
    function exportCsv(){
      const rows=ranking(),m=state.eventUser?metricMap.rev:metricMap[state.metricId];
      const head=["层级","节点","对比期日均","当前期日均","日均变化","环比","父层贡献","总盘贡献","互动率","互动人数"];
      const body=rows.map(r=>[r.kind,r.name,...[r.previous,r.current,r.delta,r.change,r.parentContribution,r.totalContribution].map(v=>Number.isFinite(v)?v:""),r.interactionAgg?.interactionRate||"",r.interactionAgg?.intUser||""]);
      const csv="\ufeff"+[head,...body].map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");
      const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=`生态监控_${pathSummary().replace(/[\\/:*?"<>|]/g,"_")}_${m.label}.csv`;a.click();URL.revokeObjectURL(a.href);
    }
    function exportTreeCsv(){
      const rows=buildTreeRows(),m=state.eventUser?metricMap.rev:metricMap[state.metricId];
      const head=["层级","层级路径","节点","对比期日均","当前期日均","日均变化","环比","父层贡献","总盘贡献","互动率","互动人数"];
      const body=rows.map(r=>[r.kind,pathKey(r.rowPath),r.name,...[r.previous,r.current,r.delta,r.change,r.parentContribution,r.totalContribution].map(v=>Number.isFinite(v)?v:""),r.interactionAgg?.interactionRate||"",r.interactionAgg?.intUser||""]);
      const csv="\ufeff"+[head,...body].map(row=>row.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");
      const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=`生态监控_复层_${pathSummary().replace(/[\\/:*?"<>|]/g,"_")}_${m.label}.csv`;a.click();URL.revokeObjectURL(a.href);
    }
    render();
  })().catch(error=>{
    const app=document.getElementById("app");
    app.innerHTML='<div class="empty">看板数据解压失败。请使用较新的 Chrome 或 Edge 打开，并保留完整的 HTML 文件。</div>';
    console.error(error);
  });
  </script>
</body>
</html>
